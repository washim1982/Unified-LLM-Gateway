apiVersion: v1
kind: Service
metadata:
  name: unified-llm-gateway-svc
  namespace: ai-platform
  labels:
    app.kubernetes.io/name: unified-llm-gateway
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: unified-llm-gateway
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: unified-gateway-sa
  namespace: ai-platform
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/BedrockGatewayExecutionRole
