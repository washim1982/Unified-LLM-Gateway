apiVersion: apps/v1
kind: Deployment
metadata:
  name: unified-llm-gateway
  namespace: ai-platform
  labels:
    app.kubernetes.io/name: unified-llm-gateway
    app.kubernetes.io/part-of: universal-ai-gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: unified-llm-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: unified-llm-gateway
      annotations:
        # AWS IAM Roles for Service Accounts (IRSA) / EKS Pod Identity
        eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/BedrockGatewayExecutionRole
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: unified-gateway-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: gateway
          image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/unified-llm-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: Gateway__Aws__Region
              valueFrom:
                configMapKeyRef:
                  name: gateway-config
                  key: AWS_REGION
            - name: Gateway__Aws__AssumeRoleArn
              valueFrom:
                configMapKeyRef:
                  name: gateway-config
                  key: AWS_ASSUME_ROLE_ARN
            - name: Gateway__Security__AdminApiKey
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: ADMIN_API_KEY
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /gateway/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /gateway/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 2
          volumeMounts:
            - name: storage-volume
              mountPath: /app/data
            - name: keys-volume
              mountPath: /app/dataprotection-keys
      volumes:
        - name: storage-volume
          persistentVolumeClaim:
            claimName: gateway-data-pvc
        - name: keys-volume
          persistentVolumeClaim:
            claimName: gateway-keys-pvc
