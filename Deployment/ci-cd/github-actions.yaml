name: Build, Test & Deploy Unified LLM Gateway

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '8.0.x'
  AWS_REGION: 'us-east-1'
  ECR_REPOSITORY: 'unified-llm-gateway'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore Dependencies
        run: dotnet restore UnifiedGateway.csproj

      - name: Build Gateway
        run: dotnet build UnifiedGateway.csproj --configuration Release --no-restore

      - name: Run Unit & Integration Tests
        run: dotnet test --configuration Release --no-build --verbosity normal

  publish-container:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC AssumeRole)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/GitHubActionsDeploymentRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag & Push Docker Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $REGISTRY/$ECR_REPOSITORY:latest -f Deployment/Dockerfile .
          docker push $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy to Amazon EKS Cluster
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name prod-ai-cluster
          kubectl set image deployment/unified-llm-gateway gateway=${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:${{ github.sha }} -n ai-platform
          kubectl rollout status deployment/unified-llm-gateway -n ai-platform
