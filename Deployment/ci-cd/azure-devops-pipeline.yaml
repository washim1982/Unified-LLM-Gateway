trigger:
  branches:
    include:
      - main
      - release/*

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'
  dotnetVersion: '8.0.x'
  imageRepository: 'unified-llm-gateway'
  containerRegistry: 'acr-ai-prod-connection'
  dockerfilePath: '$(Build.SourcesDirectory)/Deployment/Dockerfile'
  tag: '$(Build.BuildId)'

stages:
- stage: BuildAndTest
  displayName: 'Build & Test Stage'
  jobs:
  - job: Build
    displayName: 'Compile .NET 8 Minimal API'
    steps:
    - task: UseDotNet@2
      displayName: 'Install .NET Core SDK'
      inputs:
        packageType: 'sdk'
        version: $(dotnetVersion)

    - task: DotNetCoreCLI@2
      displayName: 'Restore NuGet Packages'
      inputs:
        command: 'restore'
        projects: 'UnifiedGateway.csproj'

    - task: DotNetCoreCLI@2
      displayName: 'Build Solution'
      inputs:
        command: 'build'
        projects: 'UnifiedGateway.csproj'
        arguments: '--configuration $(buildConfiguration) --no-restore'

- stage: PublishAndDeploy
  displayName: 'Build Container & Deploy'
  dependsOn: BuildAndTest
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - job: DockerBuild
    displayName: 'Docker Build and Push'
    steps:
    - task: Docker@2
      displayName: 'Build and Push Docker Image'
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(containerRegistry)
        tags: |
          $(tag)
          latest

    - task: KubernetesManifest@1
      displayName: 'Deploy to Kubernetes'
      inputs:
        action: 'deploy'
        connectionType: 'kubernetesServiceConnection'
        kubernetesServiceConnection: 'k8s-prod-cluster'
        namespace: 'ai-platform'
        manifests: |
          $(Build.SourcesDirectory)/Deployment/k8s/configmap.yaml
          $(Build.SourcesDirectory)/Deployment/k8s/deployment.yaml
          $(Build.SourcesDirectory)/Deployment/k8s/service.yaml
